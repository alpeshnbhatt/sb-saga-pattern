server:
  port: 8761

eureka:
  client:
    register-with-eureka: false   # The server itself does not register
    fetch-registry: false  

spring:
  application:
    name: api-gateway
  cloud:
   gateway:
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true

    globalcors:
      cors-configurations:
        '[/**]':
          allowedOrigins: "*"
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
# Below logics are not working 
    routes:
      - id: customer-service
        uri: lb://CUSTOMER-SERVICE
        predicates:
          - Path=/customer-server/**
        filters:
          - StripPrefix=1
      - id: order-service
        uri: http://192.168.56.1:8082/
        predicates:
          - Path=/order-service/**
        filters:
          - StripPrefix=1
      - id: inventory-service
        uri: lb://INVENTORY-SERVICE
        predicates:
          - Path=/inventory-service/**
        filters:
          - StripPrefix=1
