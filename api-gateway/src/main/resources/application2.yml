eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

server:
  port:  8761

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    consul: 
      host: ${CONSUL:localhost}
      port: ${CONSUL_PORT:8500}
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
          enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/customer-service/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order-service/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory-service/**